<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style/common.css">
    <link rel="stylesheet" href="../style/my_capes.css">
</head>
<body>
    <div class="my-capes-card">
        <!-- 顶部：头像 + 用户名 + 右上角 logo -->
        <div class="profile-bar">
            <div class="profile-left">
                <img class="player-avatar" src="{{avatar_url}}" alt="">
                <div class="profile-text">
                    <div class="player-name">{{player_name}}</div>
                    <div class="player-sub">已拥有披风</div>
                </div>
            </div>
            <img class="mc-logo" src="{{logo_url}}" alt="Minecraft">
        </div>

        <!-- 披风网格：无底无边框，3 列 -->
        <div class="capes-wrap">
            <div class="capes-grid">
                {{capes_grid_html}}
            </div>
        </div>

        <!-- 底部信息 -->
        <div class="card-footer">
            Create by <span class="footer-hl">GsCore</span> &amp; Power by <span class="footer-hl">MinecraftQueqiao</span> &amp; Auther by <span class="footer-hl">sssysy</span>
        </div>
    </div>
</body>
</html>
